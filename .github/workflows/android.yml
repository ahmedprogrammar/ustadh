name: بناء تطبيق أندرويد
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: تجهيز المشروع
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: الأيقونة والصلاحيات
        working-directory: mobile/android/app/src/main
        run: |
          rm -rf res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            cp ../../../../icons/mipmap-$n/ic_launcher.png res/mipmap-$n/ic_launcher.png
            cp res/mipmap-$n/ic_launcher.png res/mipmap-$n/ic_launcher_round.png
            rm -f res/mipmap-$n/ic_launcher_foreground.png
          done
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' AndroidManifest.xml
      - name: بناء APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../ustadh-bjebak.apk
      - name: نشر الملف
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest ustadh-bjebak.apk --title "أستاذ بجيبك - تطبيق أندرويد" --notes "آخر نسخة من التطبيق"
